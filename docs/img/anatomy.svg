<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" role="img" aria-label="The parts of an xlsx package and the relationships between them" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"><style>
  .bg{fill:var(--fig-surface,#fff)} .rule{stroke:var(--fig-rule,#e3e4e8);stroke-width:1;fill:none}
  .ink{fill:var(--fig-ink,#16181d)} .soft{fill:var(--fig-soft,#4d525c)}
  .head{fill:var(--fig-head,#f1f2f4)} .a{fill:var(--fig-accent,#1d6b4f)} .b{fill:var(--fig-accent2,#8bbfa8)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .s-soft{stroke:var(--fig-soft,#4d525c)} .f-soft{fill:var(--fig-soft,#4d525c)}
  .s-accent{stroke:var(--fig-accent,#1d6b4f)} .f-accent{fill:var(--fig-accent,#1d6b4f)}
  .s-rule{stroke:var(--fig-rule,#e3e4e8)}
  @media (prefers-color-scheme: dark){
    .s-soft{stroke:var(--fig-soft,#a2a9b5)} .f-soft{fill:var(--fig-soft,#a2a9b5)}
    .s-accent{stroke:var(--fig-accent,#5fbf95)} .f-accent{fill:var(--fig-accent,#5fbf95)}
    .s-rule{stroke:var(--fig-rule,#2b303a)}
    .bg{fill:var(--fig-surface,#14171d)} .rule{stroke:var(--fig-rule,#2b303a)}
    .ink{fill:var(--fig-ink,#e9ebef)} .soft{fill:var(--fig-soft,#a2a9b5)}
    .head{fill:var(--fig-head,#1b1f27)} .a{fill:var(--fig-accent,#5fbf95)} .b{fill:var(--fig-accent2,#2f6f57)}
  }
</style><text x="16" y="20" font-size="11" class="soft">report.xlsx — a zip of parts. chartsheet writes the three on the right and the links between them.</text><rect x="16" y="36" width="210" height="52" rx="6" class="head"/><rect x="16" y="36" width="210" height="52" rx="6" class="rule"/><text x="28" y="57" font-size="12" class="ink mono">xl/worksheets/sheet1.xml</text><text x="28" y="74" font-size="10.5" class="soft">your data, written by ExcelJS</text><rect x="16" y="116" width="210" height="52" rx="6" class="head"/><rect x="16" y="116" width="210" height="52" rx="6" class="rule"/><text x="28" y="137" font-size="12" class="ink mono">[Content_Types].xml</text><text x="28" y="154" font-size="10.5" class="soft">every part needs an Override</text><rect x="16" y="196" width="210" height="52" rx="6" class="head"/><rect x="16" y="196" width="210" height="52" rx="6" class="rule"/><text x="28" y="217" font-size="12" class="ink mono">xl/workbook.xml</text><text x="28" y="234" font-size="10.5" class="soft">lists the sheets</text><rect x="390" y="36" width="210" height="52" rx="6" class="bg"/><rect x="390" y="36" width="210" height="52" rx="6" class="rule"/><text x="402" y="57" font-size="12" class="ink mono">xl/drawings/drawing1.xml</text><text x="402" y="74" font-size="10.5" class="soft">one per sheet, holds anchors</text><rect x="390" y="116" width="210" height="52" rx="6" class="bg"/><rect x="390" y="116" width="210" height="52" rx="6" class="rule"/><text x="402" y="137" font-size="12" class="ink mono">xl/charts/chart1.xml</text><text x="402" y="154" font-size="10.5" class="soft">the chart and its series</text><rect x="390" y="196" width="210" height="52" rx="6" class="bg"/><rect x="390" y="196" width="210" height="52" rx="6" class="rule"/><text x="402" y="217" font-size="12" class="ink mono">xl/pivotTables/pivotTable1.xml</text><text x="402" y="234" font-size="10.5" class="soft">plus its cache parts</text><path d="M226 62 C 308 62, 308 62, 390 62" fill="none" class="s-accent" stroke-width="1.4"/><circle cx="390" cy="62" r="2.6" class="f-accent"/><text x="308" y="56" text-anchor="middle" font-size="9.5" class="soft">r:id</text><path d="M226 142 C 308 142, 308 142, 390 142" fill="none" class="s-accent" stroke-width="1.4"/><circle cx="390" cy="142" r="2.6" class="f-accent"/><text x="308" y="136" text-anchor="middle" font-size="9.5" class="soft">Override</text><path d="M600 88 C 600 88, 600 116, 600 116" fill="none" class="s-accent" stroke-width="1.4"/><circle cx="600" cy="116" r="2.6" class="f-accent"/><text x="612" y="106" font-size="9.5" class="soft">rel</text><path d="M226 222 C 308 222, 308 222, 390 222" fill="none" class="s-accent" stroke-width="1.4"/><circle cx="390" cy="222" r="2.6" class="f-accent"/><text x="308" y="216" text-anchor="middle" font-size="9.5" class="soft">cacheId</text></svg>