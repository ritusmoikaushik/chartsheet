<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-label="A workbook loses its chart when rewritten, and keeps it when the charts are preserved" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"><style>
